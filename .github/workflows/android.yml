name: Android CI

on:
  push:
    branches: [ main, master, 'arena/**' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper when missing
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            ERR_SUMMARY=$(grep -E "e: |FAILURE:|What went wrong|Execution failed|Exception" build.log | head -n 25 | tr '\n' ' ')
            echo "::error title=Gradle Build Error::$ERR_SUMMARY"
            exit $EXIT_CODE
          fi
        continue-on-error: false

      - name: Fallback build without wrapper
        if: failure()
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: edit-sai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Rename APK for GitHub Release
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/'))
        run: cp app/build/outputs/apk/debug/app-debug.apk edit-sai-build-${{ github.run_number }}.apk

      - name: Publish GitHub Release
        if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: EDIT SAI Build ${{ github.run_number }}
          files: edit-sai-build-${{ github.run_number }}.apk
